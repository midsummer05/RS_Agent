<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>遥感解译 Agent</title>
<style>
:root{--ink:#17324d;--bg:#f4f8fb;--card:#fff;--line:#d9e3eb;--accent:#087e8b;--warn:#b45309;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,"Segoe UI",sans-serif}header{padding:32px 6vw;background:linear-gradient(110deg,#073b4c,#087e8b);color:#fff}h1{margin:0}header p{opacity:.85;margin:8px 0 0}main{max-width:1180px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:360px 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}.wide{grid-column:1/-1}h2{font-size:17px;margin:0 0 12px}label{display:block;color:#596b7c;font-size:13px;margin:10px 0 4px}input,select,textarea,button{font:inherit;width:100%;border:1px solid var(--line);border-radius:7px;padding:9px}button{margin-top:13px;background:var(--accent);color:#fff;border:0;font-weight:650;cursor:pointer}.warn{background:var(--warn)}.bad{background:var(--bad)}.muted{color:#657789}.hidden{display:none}.stages{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.stage{font-size:12px;padding:5px 9px;border-radius:20px;background:#edf2f6;color:#5b6d7d}.done{background:#d9f4e4;color:#17633c}.current{background:#d6f0f2;color:#075e67}.status{font-size:18px;font-weight:700}.notice{padding:10px;border-radius:7px;background:#e5f5f6;color:#075963}.error{background:#fff0ef;color:#9c1c15}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.list{list-style:none;padding:0;margin:0}.list li{padding:9px 0;border-bottom:1px solid var(--line)}a{color:var(--accent);font-weight:650;text-decoration:none}pre,.trace{background:#10202d;color:#d1e5ef;border-radius:8px;padding:12px;max-height:310px;overflow:auto;font:12px ui-monospace,Consolas,monospace;white-space:pre-wrap}@media(max-width:760px){main,.cols{grid-template-columns:1fr}}
</style></head>
<body><header><h1>遥感影像解译 Agent</h1><p>可恢复工作流 · 人工审批 · 产物证据 · Trace 回放</p></header><main>
<section class="card"><h2>创建任务</h2><label>传感器</label><select id="sensor"><option value="optical">光学 RGB / 多光谱</option><option value="sar">SAR</option></select><label>上传影像（GeoTIFF / PNG / JPEG）</label><input id="file" type="file" accept=".tif,.tiff,.png,.jpg,.jpeg"><label>或容器内样例路径</label><input id="path" placeholder="/data/input/samples/optical.tif"><label>演示故障</label><select id="failure"><option value="">无</option><option value="qa_failure">质检失败（审批）</option><option value="timeout">核心工具超时（恢复）</option></select><button id="create">提交任务</button><p class="muted">未选择文件或路径时使用 mock 工作流。前端不持有模型密钥。</p></section>
<section class="card"><h2>任务状态</h2><div id="status" class="muted">尚未创建任务</div><div id="stages" class="stages"></div><div id="meta" class="muted"></div><div id="approval" class="hidden"><p class="notice">质检结果等待人工决定</p><label>重跑阶段</label><select id="approvalStage"><option value="interpret">核心解译</option><option value="postprocess">后处理</option><option value="qa">质检</option></select><label>参数覆盖（JSON，仅编辑）</label><input id="params" placeholder='{"threshold":0.1}'><label>备注</label><textarea id="comment" rows="2"></textarea><button data-action="approve">批准并继续</button><button class="warn" data-action="edit">编辑参数后重跑</button><button class="bad" data-action="reject">拒绝并重规划</button></div></section>
<section class="card wide"><h2>产物与结果</h2><div class="cols"><ul id="artifacts" class="list"><li class="muted">任务完成后显示掩膜、矢量、统计和报告。</li></ul><pre id="preview">选择 JSON / GeoJSON / Markdown 产物以预览；GeoTIFF 可下载后在 GIS 中查看。</pre></div></section>
<section class="card wide"><h2>Trace 时间线</h2><div id="traces" class="trace">等待任务事件。</div></section></main>
<script>
const api=`${location.protocol}//${location.hostname}:8001`, names={preprocess:'预处理',interpret:'核心解译',postprocess:'后处理',qa:'质检',report:'报告'};let id,source;const $=x=>document.getElementById(x);const req=async(p,o={})=>{const r=await fetch(api+p,o);if(!r.ok)throw Error(await r.text());return r};
function show(t,bad=false){$('status').innerHTML=`<div class="notice ${bad?'error':''}">${t}</div>`}function render(j){$('status').innerHTML=`<div class="status">${j.status}</div>`;$('meta').textContent=`${j.job_id} · ${j.request.sensor_type} · ${names[j.stage]||j.stage}`;$('stages').innerHTML=Object.keys(names).map(s=>`<span class="stage ${j.completed_stages.includes(s)?'done':''} ${j.stage===s&&j.status!=='completed'?'current':''}">${names[s]}</span>`).join('');$('approval').classList.toggle('hidden',j.status!=='waiting_human');const list=$('artifacts');list.innerHTML='';(j.artifacts||[]).slice().reverse().forEach(a=>{const li=document.createElement('li'),link=document.createElement('a');link.textContent=a.kind;link.href=`${api}/jobs/${id}/artifacts/${a.sha256}`;link.target='_blank';link.onclick=()=>preview(a);li.append(link,document.createTextNode(` · ${a.sha256.slice(0,12)}`));list.append(li)});if(!list.children.length)list.innerHTML='<li class="muted">暂无产物</li>'}
async function preview(a){try{if(!['json','md'].includes(a.metadata.extension)){$('preview').textContent='二进制产物请通过左侧链接下载。';return}const t=await(await req(`/jobs/${id}/artifacts/${a.sha256}`)).text();$('preview').textContent=a.metadata.extension==='json'?JSON.stringify(JSON.parse(t),null,2):t}catch(e){$('preview').textContent=e.message}}
async function traces(){if(!id)return;const x=await(await req(`/jobs/${id}/traces`)).json();$('traces').textContent=x.map(v=>`${v.created_at}  ${v.event_type}\n${JSON.stringify(v.payload)}`).join('\n\n')}
async function refresh(){if(!id)return;try{render(await(await req(`/jobs/${id}`)).json());await traces()}catch(e){show(e.message,true)}}function watch(){if(source)source.close();source=new EventSource(`${api}/jobs/${id}/events`);source.addEventListener('job',e=>{render(JSON.parse(e.data));traces()});source.onerror=()=>{source.close();refresh()}}
async function create(){try{let image_uri=$('path').value.trim()||'mock://input',f=$('file').files[0];if(f){const fd=new FormData();fd.append('file',f);image_uri=(await(await req('/uploads',{method:'POST',body:fd})).json()).image_uri}const p={task_type:'water_extraction',sensor_type:$('sensor').value,image_uri};if($('failure').value){p.failure_injections=[$('failure').value];p.injection_stage=$('failure').value==='qa_failure'?'qa':'interpret'}id=(await(await req('/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})).json()).job_id;show('任务已提交。');watch();refresh()}catch(e){show(`提交失败：${e.message}`,true)}}
async function approval(action){try{const p={action,actor:'web-user',comment:$('comment').value,stage:$('approvalStage').value};if(action==='edit')p.parameters=JSON.parse($('params').value||'{}');await req(`/jobs/${id}/approval`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});watch();refresh()}catch(e){show(`审批失败：${e.message}`,true)}}$('create').onclick=create;document.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>approval(x.dataset.action));
</script></body></html>
